name: Upload Airflow Code to S3

on:
  push:
    paths:
      - '**.py'
      - 'Dockerfile'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  upload-to-s3:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Copy files to temp folder and sync to S3
      run: |
        mkdir dist
        cp dags/*.py dist/
        cp gcmc_trainer.py dist/
        cp GCMC.py dist/
        cp requirements.txt dist/
        cp Dockerfile dist/

        aws s3 sync dist/ s3://$AWS_S3_BUCKET/dags/ --delete --exclude="*.ipynb"
      env:
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: us-west-2
