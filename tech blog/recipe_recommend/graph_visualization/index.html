<!DOCTYPE html>
<html lang="en">

<script>
    console.log("✅ JavaScript 실행됨!");  // ✅ 실행 여부 확인
</script>

<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <title>Network Graph</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        svg {
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
    </style>
</head>

<body>
    <h1>🔍 Network Graph</h1>
    <label>Search: <input type="text" id="searchBox"></label>
    <label>Min Weight: <input type="number" id="weightFilter" step="0.1" value="0"></label>
    <button onclick="updateGraph()">Search</button>

    <svg width="900" height="600"></svg>

    <script>
        // ✅ Enter 키로 검색 실행
        document.getElementById("searchBox").addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                updateGraph();
            }
        });

        function updateGraph() {
            let searchQuery = document.getElementById("searchBox").value;
            let minWeight = document.getElementById("weightFilter").value;
            let apiUrl = `http://127.0.0.1:5000/graph?search=${searchQuery}&min_weight=${minWeight}`;

            console.log("📡 API 요청:", apiUrl);

            d3.json(apiUrl).then(function (data) {
                console.log("✅ 데이터 받아옴:", data);

                // SVG 초기화
                d3.select("svg").selectAll("*").remove();
                let svg = d3.select("svg"),
                    width = +svg.attr("width"),
                    height = +svg.attr("height");

                let simulation = d3.forceSimulation(data.nodes)
                    .force("link", d3.forceLink(data.edges).id(d => d.id).distance(100))
                    .force("charge", d3.forceManyBody().strength(-300))
                    .force("center", d3.forceCenter(width / 2, height / 2));

                // ✅ 엣지 추가 (선)
                let link = svg.append("g")
                    .selectAll("line")
                    .data(data.edges)
                    .enter().append("line")
                    .style("stroke", "#aaa")
                    .style("stroke-width", d => Math.sqrt(d.weight) + 1);

                // ✅ 노드 추가 (원)
                let node = svg.append("g")
                    .selectAll("circle")
                    .data(data.nodes)
                    .enter().append("circle")
                    .attr("r", 12)
                    .style("fill", "#3498db")
                    .call(d3.drag()
                        .on("start", dragStarted)
                        .on("drag", dragged)
                        .on("end", dragEnded));

                // ✅ 노드 이름 추가 (텍스트)
                let labels = svg.append("g")
                    .selectAll("text")
                    .data(data.nodes)
                    .enter().append("text")
                    .attr("dy", 5)
                    .attr("dx", 10)
                    .text(d => d.id)
                    .style("font-size", "12px")
                    .style("fill", "#333");

                // ✅ 엣지 가중치 표시 (텍스트)
                let edgeLabels = svg.append("g")
                    .selectAll("text")
                    .data(data.edges)
                    .enter().append("text")
                    .attr("dy", -5)
                    .style("font-size", "10px")
                    .style("fill", "#666")
                    .text(d => d.weight.toFixed(2));

                // ✅ 시뮬레이션 업데이트
                simulation.on("tick", () => {
                    link.attr("x1", d => d.source.x)
                        .attr("y1", d => d.source.y)
                        .attr("x2", d => d.target.x)
                        .attr("y2", d => d.target.y);

                    node.attr("cx", d => d.x)
                        .attr("cy", d => d.y);

                    labels.attr("x", d => d.x + 15)
                        .attr("y", d => d.y + 5);

                    edgeLabels.attr("x", d => (d.source.x + d.target.x) / 2)
                        .attr("y", d => (d.source.y + d.target.y) / 2);
                });

                // ✅ 드래그 이벤트
                function dragStarted(d) {
                    if (!d3.event.active) simulation.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                }

                function dragged(d) {
                    d.fx = d3.event.x;
                    d.fy = d3.event.y;
                }

                function dragEnded(d) {
                    if (!d3.event.active) simulation.alphaTarget(0);
                    d.fx = null;
                    d.fy = null;
                }

            }).catch(error => console.error("❌ API 호출 실패:", error));
        }

        // ✅ 페이지 로딩 시 전체 그래프 불러오기
        updateGraph();
    </script>
</body>

</html>
